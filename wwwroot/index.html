<script>
(function(){
  var appReady = false;
  window.refertoAppReady = function(){
    appReady = true;
    var button = document.getElementById('home-open-button');
    if(button){
      button.disabled = false;
      button.setAttribute('aria-disabled','false');
      button.textContent = '🏐  APRI GESTIONE GARA';
    }
  };
  window.apriGestioneGara = function(){
    if(!appReady) return;
    var home = document.getElementById('home-screen');
    if(home){ home.style.display='none'; home.setAttribute('aria-hidden','true'); }
  };
  function hideHome(){
    var home=document.getElementById('home-screen');
    if(home){ home.style.display='none'; home.setAttribute('aria-hidden','true'); }
  }
  document.addEventListener('DOMContentLoaded',function(){
    // Se si apre direttamente una rotta interna (es. /archivio), non mostrare
    // la schermata iniziale sopra la pagina richiesta.
    var base=document.querySelector('base');
    var basePath=base ? new URL(base.href, window.location.href).pathname : '/';
    var currentPath=window.location.pathname;
    var normalizedBase=basePath.endsWith('/') ? basePath : basePath + '/';
    if(currentPath !== basePath && currentPath !== normalizedBase){
      hideHome();
    }
  });
})();
</script>

<script>
window.stampaReferto = (d, shareConfig = null) => {
  // Il progetto utilizza direttamente il referto HTML ufficiale fornito come modello.
  // I dati Blazor vengono convertiti nel formato atteso da RefertoFIGH.html e
  // salvati nel localStorage condiviso dalla stessa origine.
  try {
    const partita = {
      league: d.championship || '',
      championship: d.championship || '',
      group: d.group || '',
      matchNumber: d.matchNumber || '',
      matchDate: d.date || '',
      matchTime: d.time || '',
      teamA: d.casa || '',
      teamB: d.ospiti || '',
      city: d.city || '',
      venue: d.venue || '',
      season: d.season || '',
      referee1: d.referee1 || '',
      referee2: d.referee2 || '',
      delegate1: d.delegate1 || '',
      delegate2: d.delegate2 || '',
      timekeeper: d.timekeeper || '',
      secretary: d.secretary || '',
      finalScoreA: Number(d.scoreA || 0),
      finalScoreB: Number(d.scoreB || 0),
      scoreA: Number(d.scoreA || 0),
      scoreB: Number(d.scoreB || 0),
      firstHalfScoreA: Number(d.firstHalfScoreA || 0),
      firstHalfScoreB: Number(d.firstHalfScoreB || 0),
      secondHalfScoreA: Number(d.secondHalfScoreA || 0),
      secondHalfScoreB: Number(d.secondHalfScoreB || 0),
      overtime2ScoreA: Number(d.overtime2ScoreA || 0),
      overtime2ScoreB: Number(d.overtime2ScoreB || 0),
      overtime4ScoreA: Number(d.overtime4ScoreA || 0),
      overtime4ScoreB: Number(d.overtime4ScoreB || 0),
      penaltyTotalA: Number(d.penaltyTotalA || 0),
      penaltyTotalB: Number(d.penaltyTotalB || 0),
      penaltyScoredA: Number(d.penaltyScoredA || 0),
      penaltyScoredB: Number(d.penaltyScoredB || 0),
      penaltyShootout: {
        scoreA: Number(d.shootoutScoreA || 0),
        scoreB: Number(d.shootoutScoreB || 0)
      },
      timeoutsA: d.timeoutsA || {},
      timeoutsB: d.timeoutsB || {},
      currentRosterA: {
        players: (d.playersA || []).map(p => ({
          num: String(p.label ?? p.number ?? ''),
          number: String(p.label ?? p.number ?? ''),
          name: p.name || '',
          active: p.active !== false,
          goals: Number(p.goals || 0)
        })),
        officials: (d.staffA || []).map(p => ({
          lettera: p.letter || '',
          num: p.letter || '',
          name: p.name || '',
          role: p.role || ''
        }))
      },
      currentRosterB: {
        players: (d.playersB || []).map(p => ({
          num: String(p.label ?? p.number ?? ''),
          number: String(p.label ?? p.number ?? ''),
          name: p.name || '',
          active: p.active !== false,
          goals: Number(p.goals || 0)
        })),
        officials: (d.staffB || []).map(p => ({
          lettera: p.letter || '',
          num: p.letter || '',
          name: p.name || '',
          role: p.role || ''
        }))
      },
      eventi: (d.events || []).map(e => ({
        time: e.Time || e.time || '',
        squadra: e.Team || e.team || '',
        numero: e.Number || e.number || '',
        type: e.Type || e.type || '',
        text: e.Text || e.text || '',
        result: e.Result || e.result || ''
      })),
      events: (d.events || []).map(e => ({
        time: e.Time || e.time || '',
        squadra: e.Team || e.team || '',
        numero: e.Number || e.number || '',
        type: e.Type || e.type || '',
        text: e.Text || e.text || '',
        result: e.Result || e.result || ''
      })),
      shootout: d.shootout || []
    };

    localStorage.setItem('RefertoPallamano', JSON.stringify(partita));
    localStorage.setItem('RefertoFIGH', JSON.stringify(partita));

    const url = new URL('RefertoFIGH.html', document.baseURI);
    if (typeof shareConfig === 'string' && shareConfig) {
      // Compatibilità con i vecchi collegamenti che passavano un solo numero.
      url.searchParams.set('share', '1');
      url.searchParams.set('phones', shareConfig);
    } else if (shareConfig && typeof shareConfig === 'object') {
      const phones = Array.isArray(shareConfig.phones) ? shareConfig.phones : [];
      const emails = Array.isArray(shareConfig.emails) ? shareConfig.emails : [];
      if (phones.length || emails.length) {
        url.searchParams.set('share', '1');
        if (phones.length) url.searchParams.set('phones', phones.join(','));
        if (emails.length) url.searchParams.set('emails', emails.join(','));
      }
    }
    const w = window.open(url.href, '_blank');
    if (!w) {
      alert('Il browser ha bloccato l’apertura del referto. Consenti i popup per questo sito.');
      return;
    }
    try { w.focus(); } catch(e) {}
  } catch (e) {
    console.error('Errore apertura Referto FIGH', e);
    alert('Impossibile aprire il Referto FIGH.');
  }
};
</script>

<script>
window.apriCaricamentoExcel = (dotnetRef) => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.xlsx,.xlsm,.xls'; input.style.display='none';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      if (!window.XLSX) throw new Error('Lettore Excel non disponibile');
      const data = new Uint8Array(await file.arrayBuffer());
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const ws = wb.Sheets['Gara'] || wb.Sheets[wb.SheetNames[0]];
      if (!ws) throw new Error('Foglio Gara non trovato');
      const cell = a => ws[a]?.v == null ? '' : String(ws[a].v).trim();
      const dateVal = v => {
        if (!v) return '';
        if (v instanceof Date) return v.toLocaleDateString('it-IT');
        return String(v).trim();
      };
      const d = {
        matchNumber:cell('C4'), date:dateVal(ws['C5']?.v), time:cell('C6'), championship:cell('C7'),
        city:cell('C8'), venue:cell('C9'), season:cell('C10'), referee1:cell('C12'), referee2:cell('C13'),
        delegate1:cell('C14'), delegate2:cell('C15'), timekeeper:cell('C16'), secretary:cell('C17'),
        teamA:cell('G5'), teamB:cell('K5'), playersA:[], playersB:[], staffA:[], staffB:[]
      };
      for(let r=6;r<=21;r++){
        if(cell(`E${r}`)==='PLAYER_A'){ const n=cell(`F${r}`); if(n) d.playersA.push({number:String(n).trim(),name:cell(`G${r}`)}); }
        if(cell(`I${r}`)==='PLAYER_B'){ const n=cell(`J${r}`); if(n) d.playersB.push({number:String(n).trim(),name:cell(`K${r}`)}); }
      }
      for(let r=22;r<=26;r++){
        const a=cell(`F${r}`).toUpperCase(), b=cell(`J${r}`).toUpperCase();
        if(cell(`E${r}`)==='OFFICIAL_A' && a) d.staffA.push({letter:a,name:cell(`G${r}`)});
        if(cell(`I${r}`)==='OFFICIAL_B' && b) d.staffB.push({letter:b,name:cell(`K${r}`)});
      }
      await dotnetRef.invokeMethodAsync('ImportMatchData', d);
    } catch(e) { console.error(e); alert('File Excel non compatibile o dati gara non trovati.'); }
    input.remove();
  };
  document.body.appendChild(input); input.click();
};
</script>

<script>
// Archivio gestionale: persistenza locale e lettura del modello Excel.
window.archiveStorage = (() => {
  const openDb = () => new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB non disponibile')); return; }
    const request = indexedDB.open('RefertoPallamanoArchive', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('records', { keyPath: 'key' });
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  return {
    getSeed: async () => {
      try {
        const response = await fetch('data/archivio-iniziale.json', { cache: 'no-store' });
        if (!response.ok) return null;
        return await response.text();
      } catch { return null; }
    },
    get: async key => {
      if (!window.indexedDB) return localStorage.getItem(key);
      const db = await openDb();
      try {
        const value = await new Promise((resolve, reject) => {
          const request = db.transaction('records', 'readonly').objectStore('records').get(key);
          request.onsuccess = () => resolve(request.result ? request.result.value : null);
          request.onerror = () => reject(request.error || new Error('Lettura IndexedDB non riuscita.'));
        });
        // Recupera anche i dati creati da una vecchia versione che usava localStorage
        // come ripiego, ma non nasconde gli errori reali di IndexedDB.
        return value ?? localStorage.getItem(key);
      } finally { db.close(); }
    },
    set: async (key, value) => {
      if (!window.indexedDB) { localStorage.setItem(key, value); return true; }
      const db = await openDb();
      try {
        await new Promise((resolve, reject) => {
          const tx = db.transaction('records', 'readwrite');
          tx.objectStore('records').put({ key, value });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error || new Error('Salvataggio IndexedDB non riuscito.'));
          tx.onabort = () => reject(tx.error || new Error('Salvataggio IndexedDB annullato.'));
        });
        return true;
      } finally { db.close(); }
    },
    saveArchive: async (key, backupKey, value) => {
      if (!window.indexedDB) {
        const previous = localStorage.getItem(key);
        if (previous) localStorage.setItem(backupKey, previous);
        localStorage.setItem(key, value);
        return true;
      }
      const db = await openDb();
      try {
        await new Promise((resolve, reject) => {
          const tx = db.transaction('records', 'readwrite');
          const store = tx.objectStore('records');
          const read = store.get(key);
          read.onsuccess = () => {
            const previous = read.result ? read.result.value : localStorage.getItem(key);
            if (typeof previous === 'string' && previous.length > 0)
              store.put({ key: backupKey, value: previous });
            store.put({ key, value });
          };
          read.onerror = () => { try { tx.abort(); } catch {} };
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error || new Error('Salvataggio protetto IndexedDB non riuscito.'));
          tx.onabort = () => reject(tx.error || new Error('Salvataggio protetto IndexedDB annullato.'));
        });
        return true;
      } finally { db.close(); }
    }
  };
})();
window.archiveExcel = {
  read: function(base64, filename) {
    if (!window.XLSX) throw new Error('Lettore Excel non disponibile. Ricaricare la pagina.');
    const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    const wb = XLSX.read(bytes, { type: 'array', cellDates: true });
    const getRows = name => {
      const sheet = wb.Sheets[name];
      return sheet ? XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false, blankrows: true }) : [];
    };
    const clean = value => String(value ?? '').replace(/\s+/g, ' ').trim();
    const teamsRows = getRows('Squadre');
    const peopleRows = getRows('Giocatori Dirigenti');
    const gameRows = getRows('Gara');
    if (!teamsRows.length || !peopleRows.length)
      throw new Error('Il file deve contenere i fogli «Squadre» e «Giocatori Dirigenti».');

    // Il modello colloca i nomi dei campionati nella riga 5.
    // Ogni colonna con intestazione e almeno una squadra sottostante è un gruppo.
    const championships = [];
    const teams = [];
    const teamHeader = teamsRows[4] || [];
    for (let c = 0; c < teamHeader.length; c++) {
      const championship = clean(teamHeader[c]);
      if (!championship || championship.toLowerCase() === 'campionati') continue;
      const names = [];
      for (let r = 5; r < teamsRows.length; r++) {
        const name = clean(teamsRows[r]?.[c]);
        if (name) names.push(name);
      }
      // Mantiene anche i gruppi vuoti (es. Giovanile), se il titolo è presente.
      if (names.length || championship) {
        championships.push(championship);
        for (const team of names) teams.push({ championship, team });
      }
    }

    // Nel foglio persone i blocchi sono individuati dalle intestazioni:
    // riga 2 = nome campionato; riga 3 = Squadra | Giocatori/Dirigenti | NU.
    const people = [];
    const peopleHeader = peopleRows[2] || [];
    for (let c = 0; c < peopleHeader.length; c++) {
      if (clean(peopleHeader[c]).toLowerCase() !== 'squadra') continue;
      const championship = clean(peopleRows[1]?.[c]);
      const nameHeader = clean(peopleHeader[c + 1]).toLowerCase();
      if (!championship || nameHeader !== 'giocatori/dirigenti') continue;
      for (let r = 3; r < peopleRows.length; r++) {
        const team = clean(peopleRows[r]?.[c]);
        const name = clean(peopleRows[r]?.[c + 1]);
        const number = clean(peopleRows[r]?.[c + 2]);
        if (team && name) people.push({ championship, team, name, number });
      }
    }

    const season = clean(gameRows[9]?.[2]);
    if (!championships.length) throw new Error('Non ho trovato intestazioni di campionato nella riga 5 del foglio «Squadre».');
    if (!teams.length) throw new Error('Ho trovato i campionati, ma nessuna squadra sotto le relative intestazioni nel foglio «Squadre».');
    return JSON.stringify({ season, championships, teams, people });
  }
};
</script>

<script>
window.archivePdf = {
  read: async function(base64) {
    if (!window.pdfjsLib) throw new Error('Lettore PDF non disponibile. Ricaricare la pagina.');
    if (!window.Tesseract) throw new Error('Motore OCR non disponibile. Verificare la connessione e ricaricare.');
    const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    const pdf = await pdfjsLib.getDocument({data:bytes}).promise;
    if (pdf.numPages < 1) throw new Error('Il PDF non contiene pagine.');
    const page = await pdf.getPage(1);
    const textContent = await page.getTextContent();
    const textRows = new Map();
    for (const item of textContent.items || []) {
      if (!item.str || !item.str.trim() || !item.transform) continue;
      const y = Math.round(item.transform[5] / 3) * 3;
      textRows.set(y, [...(textRows.get(y) || []), item.str.trim()]);
    }
    const pdfLines = [...textRows.entries()].sort((a,b)=>b[0]-a[0]).map(x=>x[1].join(' ').replace(/\s+/g,' ').trim());
    const viewport = page.getViewport({scale:2.6});
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width); canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    await page.render({canvasContext:ctx, viewport}).promise;
    const crops = [
      {key:'A',x:.055,y:.095,w:.365,h:.405},
      {key:'B',x:.055,y:.505,w:.365,h:.42}
    ];
    const worker = await Tesseract.createWorker('eng');
    try {
      await worker.setParameters({ tessedit_pageseg_mode: '4' });
      const teams = [];
      for (const crop of crops) {
        const part = document.createElement('canvas');
        part.width = Math.floor(canvas.width*crop.w); part.height = Math.floor(canvas.height*crop.h);
        part.getContext('2d').drawImage(canvas, canvas.width*crop.x, canvas.height*crop.y,
          part.width, part.height, 0, 0, part.width, part.height);
        const result = await worker.recognize(part);
        const lines = (result.data.lines || []).map(x => x.text.replace(/[|_]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
        const expectedLabel = crop.key;
        const pdfHeader = pdfLines.find(x => new RegExp('^\\s*' + expectedLabel + '\\s+').test(x));
        const ocrHeader = lines.find(x => new RegExp('^\\s*' + expectedLabel + '\\s+').test(x)) || lines.find(x => /AC\\s*LIFE|LENO/i.test(x));
        const headerLine = pdfHeader || ocrHeader || '';
        const detectedName = headerLine
          ? headerLine.replace(new RegExp('^\\s*' + expectedLabel + '\\s+', 'i'), '').replace(/^[AB]\\s+/i,'').trim()
          : (crop.key === 'B' ? 'Squadra B (nome non letto)' : 'Squadra A (nome non letto)');
        const people = [];
        for (const line of lines) {
          const official = line.match(/UFF\s*[.\-]?\s*([A-E])\s+(.+)/i);
          if (official) {
            people.push({numberOrLetter:official[1].toUpperCase(),name:official[2].replace(/[|_]/g,' ').trim(),personType:'OFFICIAL'});
            continue;
          }
          const player = line.match(/^\s*(\d{1,2})\s+(.{3,})$/);
          if (player) {
            const name = player[2].replace(/\s+[0-9]+\s*$/,'').trim();
            if (/[A-ZÀ-Ü]{2,}/i.test(name)) people.push({numberOrLetter:player[1],name,personType:'PLAYER'});
          }
        }
        teams.push({detectedName,people});
      }
      const total = teams.reduce((n,t)=>n+t.people.length,0);
      if (total < 5) throw new Error('Non sono riuscito a leggere le rose. Verifica che il PDF sia un referto FIGH leggibile e non una scansione sfocata.');
      return JSON.stringify({teams});
    } finally { await worker.terminate(); }
  }
};
