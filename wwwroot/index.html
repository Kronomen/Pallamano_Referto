<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Repository GitHub Pages: kronomen/Pallamano_Referto -->
    <base href="/Pallamano_Referto/" />

    <title>Referto Pallamano</title>

    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" href="images/FIGH.png" />
</head>

<body>

    <div id="app">
        <div style="padding:24px;font-family:Arial,sans-serif;text-align:center;">
            Caricamento Referto Pallamano…
        </div>
    </div>

    <div id="blazor-start-error"
         style="display:none;position:fixed;inset:0;z-index:99999;background:#fff;padding:24px;font-family:Arial,sans-serif;color:#111;">
        <h2 style="margin-top:0;">Errore di avvio</h2>
        <p>Il Referto Pallamano non è riuscito ad avviarsi.</p>
        <pre id="blazor-start-error-text"
             style="white-space:pre-wrap;background:#f1f5f9;padding:12px;border-radius:8px;"></pre>
        <button type="button" onclick="location.reload()"
                style="padding:12px 18px;border:0;border-radius:8px;cursor:pointer;">
            Ricarica
        </button>
    </div>

    <!-- =========================================================
         RECOVERY AUTOMATICO
         ========================================================= -->
    <script>
        (function () {
            const KEY = "refertoPallamanoRecoveryV4";
            let recoveryTimer = null;

            window.salvaPartitaLocale = function (json) {
                try {
                    localStorage.setItem(KEY, json);
                    return true;
                } catch (e) {
                    console.error("Recovery non salvato:", e);
                    return false;
                }
            };

            window.recuperaPartitaLocale = function () {
                try {
                    return localStorage.getItem(KEY)
                        || localStorage.getItem("refertoPallamanoRecoveryV3")
                        || localStorage.getItem("refertoPallamanoRecoveryV2");
                } catch (e) {
                    console.error("Recovery non leggibile:", e);
                    return null;
                }
            };

            window.esisteRecupero = function () {
                try {
                    return !!localStorage.getItem(KEY);
                } catch (e) {
                    return false;
                }
            };

            window.avviaAutoRecovery = function (dotnetRef) {
                window.fermaAutoRecovery();

                recoveryTimer = window.setInterval(function () {
                    try {
                        dotnetRef.invokeMethodAsync("AutoSaveRecovery")
                            .catch(function () { });
                    } catch (e) { }
                }, 500);
            };

            window.fermaAutoRecovery = function () {
                if (recoveryTimer !== null) {
                    window.clearInterval(recoveryTimer);
                    recoveryTimer = null;
                }
            };
        })();
    </script>

    <!-- =========================================================
         SALVATAGGIO JSON
         ========================================================= -->
    <script>
        window.refertoDownload = function (filename, text) {
            try {
                const blob = new Blob(
                    [text],
                    { type: "application/json;charset=utf-8" }
                );

                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");

                a.href = url;
                a.download = filename || "RefertoPallamano.json";
                document.body.appendChild(a);
                a.click();
                a.remove();

                window.setTimeout(function () {
                    URL.revokeObjectURL(url);
                }, 1000);
            } catch (e) {
                console.error("Errore download JSON:", e);
            }
        };
    </script>

    <!-- =========================================================
         IMPORTAZIONE EXCEL
         ========================================================= -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script>
        window.apriCaricamentoExcel = function (dotnetRef) {

            const input = document.createElement("input");

            input.type = "file";
            input.accept = ".xlsx,.xlsm,.xls";
            input.style.display = "none";

            input.addEventListener("change", async function () {

                const file = input.files && input.files[0];

                if (!file) {
                    input.remove();
                    return;
                }

                try {

                    if (!window.XLSX) {
                        throw new Error("Lettore Excel non disponibile.");
                    }

                    const data = new Uint8Array(
                        await file.arrayBuffer()
                    );

                    const workbook = XLSX.read(data, {
                        type: "array",
                        cellDates: true
                    });

                    const sheet =
                        workbook.Sheets["Gara"]
                        || workbook.Sheets[workbook.SheetNames[0]];

                    if (!sheet) {
                        throw new Error("Foglio Gara non trovato.");
                    }

                    const cell = function (address) {
                        const value = sheet[address]?.v;
                        return value == null ? "" : String(value).trim();
                    };

                    const dateValue = function (value) {
                        if (!value) return "";

                        if (value instanceof Date) {
                            return value.toLocaleDateString("it-IT");
                        }

                        return String(value).trim();
                    };

                    const dataGara = {
                        matchNumber: cell("C4"),
                        date: dateValue(sheet["C5"]?.v),
                        time: cell("C6"),
                        championship: cell("C7"),
                        city: cell("C8"),
                        venue: cell("C9"),
                        season: cell("C10"),

                        referee1: cell("C12"),
                        referee2: cell("C13"),
                        delegate1: cell("C14"),
                        delegate2: cell("C15"),
                        timekeeper: cell("C16"),
                        secretary: cell("C17"),

                        teamA: cell("G5"),
                        teamB: cell("K5"),

                        playersA: [],
                        playersB: [],
                        staffA: [],
                        staffB: []
                    };

                    for (let r = 6; r <= 21; r++) {

                        if (cell(`E${r}`) === "PLAYER_A") {
                            const number = cell(`F${r}`);

                            if (number) {
                                dataGara.playersA.push({
                                    number: number,
                                    name: cell(`G${r}`)
                                });
                            }
                        }

                        if (cell(`I${r}`) === "PLAYER_B") {
                            const number = cell(`J${r}`);

                            if (number) {
                                dataGara.playersB.push({
                                    number: number,
                                    name: cell(`K${r}`)
                                });
                            }
                        }
                    }

                    for (let r = 22; r <= 26; r++) {

                        const letterA = cell(`F${r}`).toUpperCase();
                        const letterB = cell(`J${r}`).toUpperCase();

                        if (cell(`E${r}`) === "OFFICIAL_A" && letterA) {
                            dataGara.staffA.push({
                                letter: letterA,
                                name: cell(`G${r}`)
                            });
                        }

                        if (cell(`I${r}`) === "OFFICIAL_B" && letterB) {
                            dataGara.staffB.push({
                                letter: letterB,
                                name: cell(`K${r}`)
                            });
                        }
                    }

                    await dotnetRef.invokeMethodAsync(
                        "ImportMatchData",
                        dataGara
                    );

                } catch (error) {

                    console.error("Errore importazione Excel:", error);

                    window.alert(
                        "File Excel non compatibile o dati gara non trovati."
                    );

                } finally {
                    input.remove();
                }
            });

            document.body.appendChild(input);
            input.click();
        };
    </script>

    <!-- =========================================================
         STAMPA REFERTO
         ========================================================= -->
    <script>
        window.stampaReferto = function (d) {

            function esc(value) {
                return String(value ?? "").replace(
                    /[&<>"']/g,
                    function (c) {
                        return {
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;"
                        }[c];
                    }
                );
            }

            function numberKey(value) {
                const v = String(value ?? "").trim();

                if (v === "0") return 0;
                if (v === "00") return 0.5;

                const n = Number(v);
                return Number.isFinite(n) && n >= 1 ? n : 9999;
            }

            function renderTeam(title, players, staff, color) {

                const orderedPlayers = [...(players || [])]
                    .filter(p => p.active)
                    .sort(function (a, b) {

                        const ka = numberKey(a.label ?? a.number);
                        const kb = numberKey(b.label ?? b.number);

                        if (ka !== kb) return ka - kb;

                        return Number(a.originalIndex ?? 0)
                             - Number(b.originalIndex ?? 0);
                    });

                const playerRows = orderedPlayers.map(function (p) {
                    return `
                        <tr>
                            <td>${esc(p.label ?? p.number)}</td>
                            <td>${esc(p.name)}</td>
                            <td>X</td>
                        </tr>
                    `;
                }).join("");

                const staffRows = [...(staff || [])]
                    .filter(p => p.active)
                    .map(function (p) {
                        return `
                            <tr>
                                <td>${esc(p.letter)}</td>
                                <td>${esc(p.name)}</td>
                                <td>X</td>
                            </tr>
                        `;
                    }).join("");

                return `
                    <section class="team">
                        <h2 style="color:${esc(color)}">${esc(title)}</h2>

                        <h3>GIOCATORI</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>N.</th>
                                    <th>Nome</th>
                                    <th>IN</th>
                                </tr>
                            </thead>
                            <tbody>${playerRows}</tbody>
                        </table>

                        <h3>DIRIGENTI</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>N.</th>
                                    <th>Nome</th>
                                    <th>IN</th>
                                </tr>
                            </thead>
                            <tbody>${staffRows}</tbody>
                        </table>
                    </section>
                `;
            }

            const eventRows = (d.events || []).map(function (e) {
                return `
                    <tr>
                        <td>${esc(e.Time)}</td>
                        <td>${esc(e.Team)}</td>
                        <td>${esc(e.Number)}</td>
                        <td>${esc(e.Text)}</td>
                        <td>${esc(e.Result)}</td>
                    </tr>
                `;
            }).join("");

            const printWindow = window.open("", "_blank");

            if (!printWindow) {
                window.alert("Il browser ha bloccato la finestra di stampa.");
                return;
            }

            printWindow.document.write(`
                <!DOCTYPE html>
                <html lang="it">
                <head>
                    <meta charset="utf-8">
                    <title>Referto Pallamano</title>

                    <style>
                        @page {
                            size: A4 landscape;
                            margin: 10mm;
                        }

                        * {
                            box-sizing: border-box;
                        }

                        body {
                            margin: 0;
                            font-family: Arial, sans-serif;
                            color: #111827;
                            font-size: 10px;
                        }

                        .head {
                            text-align: center;
                            border-bottom: 2px solid #111827;
                            padding-bottom: 6px;
                        }

                        h1 {
                            margin: 0 0 3px;
                            font-size: 20px;
                        }

                        .score {
                            margin: 5px;
                            font-size: 22px;
                            font-weight: 900;
                        }

                        .meta {
                            display: grid;
                            grid-template-columns: repeat(6, 1fr);
                            gap: 4px;
                            margin: 6px 0;
                        }

                        .meta div {
                            border: 1px solid #aaa;
                            padding: 4px;
                        }

                        .teams {
                            display: grid;
                            grid-template-columns: 1fr 1fr;
                            gap: 8px;
                        }

                        .team {
                            border: 1px solid #aaa;
                            padding: 5px;
                        }

                        h2 {
                            margin: 4px 0;
                            font-size: 15px;
                        }

                        h3 {
                            margin: 7px 0 3px;
                            font-size: 11px;
                        }

                        table {
                            width: 100%;
                            border-collapse: collapse;
                        }

                        th,
                        td {
                            border: 1px solid #aaa;
                            padding: 3px;
                            text-align: left;
                        }

                        th {
                            background: #eee;
                        }

                        .events {
                            margin-top: 8px;
                        }
                    </style>
                </head>

                <body>

                    <div class="head">
                        <h1>FEDERAZIONE ITALIANA GIUOCO HANDBALL</h1>
                        <div>REFERTO PALLAMANO</div>

                        <div class="score">
                            ${esc(d.casa)}
                            &nbsp;
                            ${esc(d.scoreA)}
                            —
                            ${esc(d.scoreB)}
                            &nbsp;
                            ${esc(d.ospiti)}
                        </div>
                    </div>

                    <div class="meta">
                        <div>Numero gara<br><b>${esc(d.matchNumber)}</b></div>
                        <div>Data<br><b>${esc(d.date)}</b></div>
                        <div>Ora<br><b>${esc(d.time)}</b></div>
                        <div>Campionato<br><b>${esc(d.championship)}</b></div>
                        <div>Località<br><b>${esc(d.city)}</b></div>
                        <div>Impianto<br><b>${esc(d.venue)}</b></div>
                    </div>

                    <div class="teams">
                        ${renderTeam(d.casa, d.playersA, d.staffA, d.colorA)}
                        ${renderTeam(d.ospiti, d.playersB, d.staffB, d.colorB)}
                    </div>

                    <section class="events">
                        <h2>REGISTRO GARA</h2>

                        <table>
                            <thead>
                                <tr>
                                    <th>Tempo</th>
                                    <th>Sq</th>
                                    <th>N.</th>
                                    <th>Evento</th>
                                    <th>Ris.</th>
                                </tr>
                            </thead>
                            <tbody>${eventRows}</tbody>
                        </table>
                    </section>

                </body>
                </html>
            `);

            printWindow.document.close();
            printWindow.focus();

            window.setTimeout(function () {
                printWindow.print();
            }, 300);
        };
    </script>

    <!-- =========================================================
         AVVIO BLAZOR
         ========================================================= -->
    <script src="_framework/blazor.webassembly.js"
            autostart="false"></script>

    <script>
        (async function () {

            function showStartError(error) {

                console.error("Errore avvio Blazor:", error);

                const box = document.getElementById("blazor-start-error");
                const text = document.getElementById("blazor-start-error-text");

                if (box) box.style.display = "block";

                if (text) {
                    text.textContent =
                        error && error.toString
                            ? error.toString()
                            : String(error);
                }
            }

            try {

                if (!window.Blazor || !window.Blazor.start) {
                    throw new Error(
                        "Blazor WebAssembly non è stato caricato."
                    );
                }

                await window.Blazor.start();

            } catch (error) {

                showStartError(error);

            }

        })();
    </script>

</body>
</html>
