<script>
(function(){
  const KEY = 'refertoPallamanoRecoveryV4';
  window.salvaPartitaLocale = function(json){ try { localStorage.setItem(KEY, json); return true; } catch(e){ return false; } };
  window.recuperaPartitaLocale = function(){ try { return localStorage.getItem(KEY) || localStorage.getItem('refertoPallamanoRecoveryV3') || localStorage.getItem('refertoPallamanoRecoveryV2'); } catch(e){ return null; } };
  window.esisteRecupero = function(){ try { return !!localStorage.getItem(KEY); } catch(e){ return false; } };
  let recoveryTimer = null;
  window.avviaAutoRecovery = function(dotnetRef){
    if (recoveryTimer) clearInterval(recoveryTimer);
    recoveryTimer = setInterval(function(){ try { dotnetRef.invokeMethodAsync('AutoSaveRecovery').catch(function(){}); } catch(e){} }, 500);
  };
  window.fermaAutoRecovery = function(){ if(recoveryTimer){ clearInterval(recoveryTimer); recoveryTimer=null; } };
})();
</script>

<script>
(function(){
  function openGame(){
    var home=document.getElementById('home-screen');
    if(home){ home.style.display='none'; home.setAttribute('aria-hidden','true'); }
  }
  document.addEventListener('DOMContentLoaded',function(){
    var btn=document.getElementById('home-open-button');
    if(btn) btn.addEventListener('click',openGame);
  });
})();
</script>

<script>
window.refertoDownload = (filename, text) => {
  const blob = new Blob([text], {type:'application/json;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
</script>

<script>
window.stampaReferto = (d) => {
  // Il progetto utilizza direttamente il referto HTML ufficiale fornito come modello.
  // I dati Blazor vengono convertiti nel formato atteso da RefertoFIGH.html e
  // salvati nel localStorage condiviso dalla stessa origine.
  try {
    const partita = {
      league: d.championship || '',
      championship: d.championship || '',
      group: d.group || '',
      matchNumber: d.matchNumber || '',
      matchDate: d.date || '',
      matchTime: d.time || '',
      teamA: d.casa || '',
      teamB: d.ospiti || '',
      city: d.city || '',
      venue: d.venue || '',
      season: d.season || '',
      referee1: d.referee1 || '',
      referee2: d.referee2 || '',
      delegate1: d.delegate1 || '',
      delegate2: d.delegate2 || '',
      timekeeper: d.timekeeper || '',
      secretary: d.secretary || '',
      finalScoreA: Number(d.scoreA || 0),
      finalScoreB: Number(d.scoreB || 0),
      scoreA: Number(d.scoreA || 0),
      scoreB: Number(d.scoreB || 0),
      firstHalfScoreA: Number(d.firstHalfScoreA || 0),
      firstHalfScoreB: Number(d.firstHalfScoreB || 0),
      secondHalfScoreA: Number(d.secondHalfScoreA || 0),
      secondHalfScoreB: Number(d.secondHalfScoreB || 0),
      overtime2ScoreA: Number(d.overtime2ScoreA || 0),
      overtime2ScoreB: Number(d.overtime2ScoreB || 0),
      overtime4ScoreA: Number(d.overtime4ScoreA || 0),
      overtime4ScoreB: Number(d.overtime4ScoreB || 0),
      penaltyTotalA: Number(d.penaltyTotalA || 0),
      penaltyTotalB: Number(d.penaltyTotalB || 0),
      penaltyScoredA: Number(d.penaltyScoredA || 0),
      penaltyScoredB: Number(d.penaltyScoredB || 0),
      penaltyShootout: {
        scoreA: Number(d.shootoutScoreA || 0),
        scoreB: Number(d.shootoutScoreB || 0)
      },
      timeoutsA: d.timeoutsA || {},
      timeoutsB: d.timeoutsB || {},
      currentRosterA: {
        players: (d.playersA || []).map(p => ({
          num: String(p.label ?? p.number ?? ''),
          number: String(p.label ?? p.number ?? ''),
          name: p.name || '',
          active: p.active !== false,
          goals: Number(p.goals || 0)
        })),
        officials: (d.staffA || []).map(p => ({
          lettera: p.letter || '',
          num: p.letter || '',
          name: p.name || '',
          role: p.role || ''
        }))
      },
      currentRosterB: {
        players: (d.playersB || []).map(p => ({
          num: String(p.label ?? p.number ?? ''),
          number: String(p.label ?? p.number ?? ''),
          name: p.name || '',
          active: p.active !== false,
          goals: Number(p.goals || 0)
        })),
        officials: (d.staffB || []).map(p => ({
          lettera: p.letter || '',
          num: p.letter || '',
          name: p.name || '',
          role: p.role || ''
        }))
      },
      eventi: (d.events || []).map(e => ({
        time: e.Time || e.time || '',
        squadra: e.Team || e.team || '',
        numero: e.Number || e.number || '',
        type: e.Type || e.type || '',
        text: e.Text || e.text || '',
        result: e.Result || e.result || ''
      })),
      events: (d.events || []).map(e => ({
        time: e.Time || e.time || '',
        squadra: e.Team || e.team || '',
        numero: e.Number || e.number || '',
        type: e.Type || e.type || '',
        text: e.Text || e.text || '',
        result: e.Result || e.result || ''
      })),
      shootout: d.shootout || []
    };

    localStorage.setItem('RefertoPallamano', JSON.stringify(partita));
    localStorage.setItem('RefertoFIGH', JSON.stringify(partita));

    const url = new URL('RefertoFIGH.html', document.baseURI).href;
    const w = window.open(url, '_blank');
    if (!w) {
      alert('Il browser ha bloccato l’apertura del referto. Consenti i popup per questo sito.');
      return;
    }
    try { w.focus(); } catch(e) {}
  } catch (e) {
    console.error('Errore apertura Referto FIGH', e);
    alert('Impossibile aprire il Referto FIGH.');
  }
};
</script>

<script>
window.apriCaricamentoExcel = (dotnetRef) => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.xlsx,.xlsm,.xls'; input.style.display='none';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      if (!window.XLSX) throw new Error('Lettore Excel non disponibile');
      const data = new Uint8Array(await file.arrayBuffer());
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const ws = wb.Sheets['Gara'] || wb.Sheets[wb.SheetNames[0]];
      if (!ws) throw new Error('Foglio Gara non trovato');
      const cell = a => ws[a]?.v == null ? '' : String(ws[a].v).trim();
      const dateVal = v => {
        if (!v) return '';
        if (v instanceof Date) return v.toLocaleDateString('it-IT');
        return String(v).trim();
      };
      const d = {
        matchNumber:cell('C4'), date:dateVal(ws['C5']?.v), time:cell('C6'), championship:cell('C7'),
        city:cell('C8'), venue:cell('C9'), season:cell('C10'), referee1:cell('C12'), referee2:cell('C13'),
        delegate1:cell('C14'), delegate2:cell('C15'), timekeeper:cell('C16'), secretary:cell('C17'),
        teamA:cell('G5'), teamB:cell('K5'), playersA:[], playersB:[], staffA:[], staffB:[]
      };
      for(let r=6;r<=21;r++){
        if(cell(`E${r}`)==='PLAYER_A'){ const n=cell(`F${r}`); if(n) d.playersA.push({number:String(n).trim(),name:cell(`G${r}`)}); }
        if(cell(`I${r}`)==='PLAYER_B'){ const n=cell(`J${r}`); if(n) d.playersB.push({number:String(n).trim(),name:cell(`K${r}`)}); }
      }
      for(let r=22;r<=26;r++){
        const a=cell(`F${r}`).toUpperCase(), b=cell(`J${r}`).toUpperCase();
        if(cell(`E${r}`)==='OFFICIAL_A' && a) d.staffA.push({letter:a,name:cell(`G${r}`)});
        if(cell(`I${r}`)==='OFFICIAL_B' && b) d.staffB.push({letter:b,name:cell(`K${r}`)});
      }
      await dotnetRef.invokeMethodAsync('ImportMatchData', d);
    } catch(e) { console.error(e); alert('File Excel non compatibile o dati gara non trovati.'); }
    input.remove();
  };
  document.body.appendChild(input); input.click();
};
</script>

<script>
window.chiudiApplicazione = function(){
  try { window.close(); } catch(e) {}
  setTimeout(function(){
    try {
      if (!window.closed) {
        document.body.innerHTML = '<div style="height:100vh;display:grid;place-items:center;background:#eef2f7;font-family:Arial,sans-serif"><div style="text-align:center;padding:30px"><h2>Referto Pallamano</h2><p>Puoi chiudere questa scheda del browser.</p></div></div>';
      }
    } catch(e) {}
  }, 150);
};
</script>
