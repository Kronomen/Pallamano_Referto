<script>
(function(){
  const KEY = 'refertoPallamanoRecoveryV4';
  window.salvaPartitaLocale = function(json){ try { localStorage.setItem(KEY, json); return true; } catch(e){ return false; } };
  window.recuperaPartitaLocale = function(){ try { return localStorage.getItem(KEY) || localStorage.getItem('refertoPallamanoRecoveryV3') || localStorage.getItem('refertoPallamanoRecoveryV2'); } catch(e){ return null; } };
  window.esisteRecupero = function(){ try { return !!localStorage.getItem(KEY); } catch(e){ return false; } };
  let recoveryTimer = null;
  window.avviaAutoRecovery = function(dotnetRef){
    if (recoveryTimer) clearInterval(recoveryTimer);
    recoveryTimer = setInterval(function(){ try { dotnetRef.invokeMethodAsync('AutoSaveRecovery').catch(function(){}); } catch(e){} }, 500);
  };
  window.fermaAutoRecovery = function(){ if(recoveryTimer){ clearInterval(recoveryTimer); recoveryTimer=null; } };
})();
</script>

<script id="referto-figh-project-override">
/*
 * REFERTO FIGH INTEGRATO NEL PROGETTO.
 * Il layout e la struttura sono quelli del modello RefertoFIGH_v2x(2).html.
 * I dati della gara vengono preparati qui e letti dal referto-figh.html.
 */
window.stampaReferto = (d) => {
  try {
    const events = (d.events || []).map(e => ({
      Time: e.Time ?? "",
      Team: e.Team ?? "",
      Number: e.Number ?? "",
      Type: e.Type ?? "",
      Text: e.Text ?? "",
      Result: e.Result ?? "",
      SuspensionStartSeconds: e.SuspensionStartSeconds ?? null
    }));

    const makePlayers = (players, team) => (players || []).map(p => {
      const num = String(p.label ?? p.number ?? "").trim();
      const mine = events.filter(e => String(e.Team).toUpperCase() === team && String(e.Number).trim() === num);
      const yellow = mine.find(e => e.Type === "YELLOW");
      const twos = mine.filter(e =>
        e.Type === "TWO" || (e.Type === "RED" && String(e.Text || "").toUpperCase().includes("3X2"))
      );
      const directRed = mine.find(e => e.Type === "RED" && !String(e.Text || "").toUpperCase().includes("3X2"));
      const thirdTwo = mine.find(e => e.Type === "RED" && String(e.Text || "").toUpperCase().includes("3X2"));
      const goals = mine.filter(e => e.Type === "GOAL" || e.Type === "PENALTY_GOAL").length;
      return {
        num,
        name: p.name || "",
        goals,
        yellowTime: yellow?.Time || "",
        susp1Time: twos[0]?.Time || "",
        susp2Time: twos[1]?.Time || "",
        susp3Time: thirdTwo?.Time || (twos.length >= 3 ? twos[2]?.Time || "" : ""),
        suspensions: twos.length,
        directRedTime: directRed?.Time || ""
      };
    });

    const makeOfficials = (staff, team) => (staff || []).map(s => {
      const letter = String(s.letter ?? "").trim();
      const mine = events.filter(e => String(e.Team).toUpperCase() === team && String(e.Number).trim() === letter);
      const red = mine.find(e => e.Type === "RED");
      return {
        num: letter,
        role: letter,
        name: s.name || "",
        red: !!red,
        redTime: red?.Time || "",
        sanction: red ? (String(red.Text || "").toUpperCase().includes("3X2") ? "3x2'" : "SQ") : ""
      };
    });

    const timeoutList = team => events
      .filter(e => String(e.Team).toUpperCase() === team && ["TIMEOUT","T.O.","TO"].includes(String(e.Type).toUpperCase()))
      .map(e => e.Time || "");

    const phase = d.phaseScores || {};
    const scoreOf = key => phase[key] ?? "0-0";
    const splitScore = value => {
      const m = String(value ?? "0-0").match(/(-?\d+)\s*[-–]\s*(-?\d+)/);
      return m ? { A:Number(m[1]), B:Number(m[2]) } : {A:0,B:0};
    };
    const p1 = splitScore(scoreOf("1"));
    const p2 = splitScore(scoreOf("2"));
    const p3 = splitScore(scoreOf("3"));
    const p4 = splitScore(scoreOf("4"));

    const partita = {
      league: d.championship || "",
      group: d.group || "",
      matchNumber: d.matchNumber || "",
      teamA: d.casa || "",
      teamB: d.ospiti || "",
      city: d.city || "",
      venue: d.venue || "",
      matchDate: d.date || "",
      referee1: d.referee1 || "",
      referee2: d.referee2 || "",
      delegate1: d.delegate1 || "",
      delegate2: d.delegate2 || "",
      currentRosterA: { players: makePlayers(d.playersA, "A"), officials: makeOfficials(d.staffA, "A") },
      currentRosterB: { players: makePlayers(d.playersB, "B"), officials: makeOfficials(d.staffB, "B") },
      eventi: events,
      finalScoreA: Number(d.scoreA || 0),
      finalScoreB: Number(d.scoreB || 0),
      firstHalfScoreA: p1.A,
      firstHalfScoreB: p1.B,
      secondHalfScoreA: p2.A,
      secondHalfScoreB: p2.B,
      overtime2ScoreA: p3.A,
      overtime2ScoreB: p3.B,
      overtime4ScoreA: p4.A,
      overtime4ScoreB: p4.B,
      penaltyTotalA: Number(d.penaltyTotalA || 0),
      penaltyScoredA: Number(d.penaltyScoredA || 0),
      penaltyTotalB: Number(d.penaltyTotalB || 0),
      penaltyScoredB: Number(d.penaltyScoredB || 0),
      timeoutsA: { firstTime: timeoutList("A")[0] || "", secondTime: timeoutList("A")[1] || "", thirdTime: timeoutList("A")[2] || "" },
      timeoutsB: { firstTime: timeoutList("B")[0] || "", secondTime: timeoutList("B")[1] || "", thirdTime: timeoutList("B")[2] || "" },
      penaltyShootout: { scoreA: Number(d.shootoutScoreA || 0), scoreB: Number(d.shootoutScoreB || 0) },
      rigoriFinali: { A: Number(d.shootoutScoreA || 0), B: Number(d.shootoutScoreB || 0) },
      risultati: {
        primoTempo: { A:p1.A, B:p1.B },
        secondoTempo: { A:p2.A, B:p2.B },
        primoSupplementare: { A:p3.A, B:p3.B },
        secondoSupplementare: { A:p4.A, B:p4.B },
        finale: { A:Number(d.scoreA || 0), B:Number(d.scoreB || 0) },
        rigoriFinali: { A:Number(d.shootoutScoreA || 0), B:Number(d.shootoutScoreB || 0) }
      }
    };

    localStorage.setItem("RefertoFIGH", JSON.stringify(partita));
    const w = window.open("referto-figh.html", "_blank");
    if (!w) {
      alert("Impossibile aprire il referto. Consenti le finestre popup per il referto.");
      return;
    }
    w.focus();
  } catch (err) {
    console.error("Errore apertura Referto FIGH:", err);
    alert("Errore durante la preparazione del Referto FIGH.");
  }
};
</script>

<script>
window.refertoDownload = (filename, text) => {
  const blob = new Blob([text], {type:'application/json;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
</script>



<script>
window.apriCaricamentoExcel = (dotnetRef) => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.xlsx,.xlsm,.xls'; input.style.display='none';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      if (!window.XLSX) throw new Error('Lettore Excel non disponibile');
      const data = new Uint8Array(await file.arrayBuffer());
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const ws = wb.Sheets['Gara'] || wb.Sheets[wb.SheetNames[0]];
      if (!ws) throw new Error('Foglio Gara non trovato');
      const cell = a => ws[a]?.v == null ? '' : String(ws[a].v).trim();
      const dateVal = v => {
        if (!v) return '';
        if (v instanceof Date) return v.toLocaleDateString('it-IT');
        return String(v).trim();
      };
      const d = {
        matchNumber:cell('C4'), date:dateVal(ws['C5']?.v), time:cell('C6'), championship:cell('C7'),
        city:cell('C8'), venue:cell('C9'), season:cell('C10'), referee1:cell('C12'), referee2:cell('C13'),
        delegate1:cell('C14'), delegate2:cell('C15'), timekeeper:cell('C16'), secretary:cell('C17'),
        teamA:cell('G5'), teamB:cell('K5'), playersA:[], playersB:[], staffA:[], staffB:[]
      };
      for(let r=6;r<=21;r++){
        if(cell(`E${r}`)==='PLAYER_A'){ const n=cell(`F${r}`); if(n) d.playersA.push({number:String(n).trim(),name:cell(`G${r}`)}); }
        if(cell(`I${r}`)==='PLAYER_B'){ const n=cell(`J${r}`); if(n) d.playersB.push({number:String(n).trim(),name:cell(`K${r}`)}); }
      }
      for(let r=22;r<=26;r++){
        const a=cell(`F${r}`).toUpperCase(), b=cell(`J${r}`).toUpperCase();
        if(cell(`E${r}`)==='OFFICIAL_A' && a) d.staffA.push({letter:a,name:cell(`G${r}`)});
        if(cell(`I${r}`)==='OFFICIAL_B' && b) d.staffB.push({letter:b,name:cell(`K${r}`)});
      }
      await dotnetRef.invokeMethodAsync('ImportMatchData', d);
    } catch(e) { console.error(e); alert('File Excel non compatibile o dati gara non trovati.'); }
    input.remove();
  };
  document.body.appendChild(input); input.click();
};
</script>
