<script>
(function(){
  const KEY = 'refertoPallamanoRecoveryV4';
  window.salvaPartitaLocale = function(json){ try { localStorage.setItem(KEY, json); return true; } catch(e){ return false; } };
  window.recuperaPartitaLocale = function(){ try { return localStorage.getItem(KEY) || localStorage.getItem('refertoPallamanoRecoveryV3') || localStorage.getItem('refertoPallamanoRecoveryV2'); } catch(e){ return null; } };
  window.esisteRecupero = function(){ try { return !!localStorage.getItem(KEY); } catch(e){ return false; } };
  let recoveryTimer = null;
  window.avviaAutoRecovery = function(dotnetRef){
    if (recoveryTimer) clearInterval(recoveryTimer);
    recoveryTimer = setInterval(function(){ try { dotnetRef.invokeMethodAsync('AutoSaveRecovery').catch(function(){}); } catch(e){} }, 500);
  };
  window.fermaAutoRecovery = function(){ if(recoveryTimer){ clearInterval(recoveryTimer); recoveryTimer=null; } };
})();
</script>

<script>
window.refertoDownload = (filename, text) => {
  const blob = new Blob([text], {type:'application/json;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
</script>

<script>
window.stampaReferto = (d) => {
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const roster = (title, players, staff, color) => { const key=n=>{ const v=String(n??'').trim(); if(v==='0') return 0; if(v==='00') return 0.5; const x=Number(v); return Number.isFinite(x)&&x>=1 ? x : 9999; }; players = [...(players||[])].filter(p=>p.active).sort((a,b)=>{ const ka=key(a.label ?? a.number), kb=key(b.label ?? b.number); if(ka!==kb) return ka-kb; return Number(a.originalIndex??0)-Number(b.originalIndex??0); }); return `
    <section class="team"><h2 style="color:${esc(color)}">${esc(title)}</h2>
      <h3>GIOCATORI</h3><table><thead><tr><th>N.</th><th>Nome</th><th>IN</th></tr></thead><tbody>
      ${players.map(p=>`<tr><td>${esc(p.label ?? p.number)}</td><td>${esc(p.name)}</td><td>${p.active?'X':''}</td></tr>`).join('')}
      </tbody></table>
      <h3>DIRIGENTI</h3><table><thead><tr><th>N.</th><th>Nome</th><th>IN</th></tr></thead><tbody>
      ${[...(staff||[])].filter(p=>p.active).map(p=>`<tr><td>${esc(p.letter)}</td><td>${esc(p.name)}</td><td>${p.active?'X':''}</td></tr>`).join('')}
      </tbody></table></section>`; };
  const rows = d.events.map(e=>`<tr><td>${esc(e.Time)}</td><td>${esc(e.Team)}</td><td>${esc(e.Number)}</td><td>${esc(e.Text)}</td><td>${esc(e.Result)}</td></tr>`).join('');
  const w=window.open('', '_blank'); if(!w) return;
  w.document.write(`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Referto Pallamano</title><style>
  @page{size:A4 landscape;margin:10mm}body{font-family:Arial,sans-serif;color:#111827;font-size:10px;margin:0}h1{text-align:center;font-size:20px;margin:0 0 3px}h2{font-size:15px;margin:8px 0 4px}h3{font-size:11px;margin:7px 0 3px}.head{text-align:center;border-bottom:2px solid #111827;padding-bottom:6px}.score{text-align:center;font-size:22px;font-weight:900;margin:5px}.meta{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0}.meta div{border:1px solid #aaa;padding:4px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}.team{border:1px solid #aaa;padding:5px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #aaa;padding:3px;text-align:left}th{background:#eee}.events{margin-top:8px}.events th:nth-child(1){width:45px}.events th:nth-child(2){width:28px}.events th:nth-child(3){width:35px}.events th:nth-child(5){width:55px}</style></head><body>
  <div class="head"><h1>FEDERAZIONE ITALIANA GIUOCO HANDBALL</h1><div>REFERTO PALLAMANO</div><div class="score">${esc(d.casa)} &nbsp; ${esc(d.scoreA)} — ${esc(d.scoreB)} &nbsp; ${esc(d.ospiti)}</div></div>
  <div class="meta"><div>Numero gara<br><b>${esc(d.matchNumber)}</b></div><div>Data<br><b>${esc(d.date)}</b></div><div>Ora<br><b>${esc(d.time)}</b></div><div>Campionato<br><b>${esc(d.championship)}</b></div><div>Località<br><b>${esc(d.city)}</b></div><div>Impianto<br><b>${esc(d.venue)}</b></div></div>
  <div class="teams">${roster(d.casa,d.playersA,d.staffA,d.colorA)}${roster(d.ospiti,d.playersB,d.staffB,d.colorB)}</div>
  <section class="events"><h2>REGISTRO GARA</h2><table><thead><tr><th>Tempo</th><th>Sq</th><th>N.</th><th>Evento</th><th>Ris.</th></tr></thead><tbody>${rows}</tbody></table></section>
  




</body></html>`); w.document.close(); w.focus(); setTimeout(()=>w.print(),300);
};
</script>

<script>
window.apriCaricamentoExcel = (dotnetRef) => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.xlsx,.xlsm,.xls'; input.style.display='none';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      if (!window.XLSX) throw new Error('Lettore Excel non disponibile');
      const data = new Uint8Array(await file.arrayBuffer());
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const ws = wb.Sheets['Gara'] || wb.Sheets[wb.SheetNames[0]];
      if (!ws) throw new Error('Foglio Gara non trovato');
      const cell = a => ws[a]?.v == null ? '' : String(ws[a].v).trim();
      const dateVal = v => {
        if (!v) return '';
        if (v instanceof Date) return v.toLocaleDateString('it-IT');
        return String(v).trim();
      };
      const d = {
        matchNumber:cell('C4'), date:dateVal(ws['C5']?.v), time:cell('C6'), championship:cell('C7'),
        city:cell('C8'), venue:cell('C9'), season:cell('C10'), referee1:cell('C12'), referee2:cell('C13'),
        delegate1:cell('C14'), delegate2:cell('C15'), timekeeper:cell('C16'), secretary:cell('C17'),
        teamA:cell('G5'), teamB:cell('K5'), playersA:[], playersB:[], staffA:[], staffB:[]
      };
      for(let r=6;r<=21;r++){
        if(cell(`E${r}`)==='PLAYER_A'){ const n=cell(`F${r}`); if(n) d.playersA.push({number:String(n).trim(),name:cell(`G${r}`)}); }
        if(cell(`I${r}`)==='PLAYER_B'){ const n=cell(`J${r}`); if(n) d.playersB.push({number:String(n).trim(),name:cell(`K${r}`)}); }
      }
      for(let r=22;r<=26;r++){
        const a=cell(`F${r}`).toUpperCase(), b=cell(`J${r}`).toUpperCase();
        if(cell(`E${r}`)==='OFFICIAL_A' && a) d.staffA.push({letter:a,name:cell(`G${r}`)});
        if(cell(`I${r}`)==='OFFICIAL_B' && b) d.staffB.push({letter:b,name:cell(`K${r}`)});
      }
      await dotnetRef.invokeMethodAsync('ImportMatchData', d);
    } catch(e) { console.error(e); alert('File Excel non compatibile o dati gara non trovati.'); }
    input.remove();
  };
  document.body.appendChild(input); input.click();
};
</script>
