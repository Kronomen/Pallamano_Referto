name: Deploy Referto Pallamano

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compila e prepara GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: RefertoPallamano_Blazor.csproj

      - name: Ripristina dipendenze
        run: dotnet restore RefertoPallamano_Blazor.csproj

      - name: Verifica compilazione
        run: dotnet build RefertoPallamano_Blazor.csproj --configuration Release --no-restore

      - name: Pubblica Blazor
        run: dotnet publish RefertoPallamano_Blazor.csproj --configuration Release --no-build --no-restore --output release

      - name: Verifica file pubblicati
        run: |
          test -f release/wwwroot/index.html
          test -d release/wwwroot/_framework
          echo "File Blazor necessari presenti."

      - name: Configura GitHub Pages e fallback Blazor
        run: |
          sed -i 's|<base href="/"[[:space:]]*/>|<base href="/Pallamano_Referto/" />|' release/wwwroot/index.html
          grep -Fq '<base href="/Pallamano_Referto/"' release/wwwroot/index.html
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll
          test -f release/wwwroot/404.html
          test -f release/wwwroot/.nojekyll

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    name: Pubblica su GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compila e prepara GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: RefertoPallamano_Blazor.csproj

      - name: Ripristina dipendenze
        run: dotnet restore RefertoPallamano_Blazor.csproj

      - name: Verifica compilazione
        run: dotnet build RefertoPallamano_Blazor.csproj --configuration Release --no-restore

      - name: Pubblica Blazor
        run: dotnet publish RefertoPallamano_Blazor.csproj --configuration Release --no-build --no-restore --output release

      - name: Verifica file pubblicati
        run: |
          test -f release/wwwroot/index.html
          test -d release/wwwroot/_framework
          echo "File Blazor necessari presenti."

      - name: Imposta base href per GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/Pallamano_Referto/" />|' release/wwwroot/index.html
          if ! grep -Fq '<base href="/Pallamano_Referto/"' release/wwwroot/index.html; then
            echo "ERRORE: base href GitHub Pages non impostato."
            exit 1
          fi

      - name: Disabilita Jekyll
        run: touch release/wwwroot/.nojekyll

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    name: Pubblica su GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
