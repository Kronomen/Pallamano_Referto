name: Validate archive deletion integration

on:
  push:
    branches:
      - sviluppo/operator-access-eliminazioni
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RefertoPallamano_Blazor.csproj
      - name: Build Release
        run: dotnet build RefertoPallamano_Blazor.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish RefertoPallamano_Blazor.csproj --configuration Release --no-build --no-restore --output release
