name: Validate roster restoration
on:
  push:
    branches:
      - ripristino-convocazioni-cloud
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate production Worker syntax
        run: node --check cloudflare/worker-operator-access.js
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RefertoPallamano_Blazor.csproj
      - name: Build
        run: dotnet build RefertoPallamano_Blazor.csproj --configuration Release --no-restore
