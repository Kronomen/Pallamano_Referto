name: Build definitive release package

on:
  push:
    branches:
      - versione-definitiva
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: versione-definitiva

      - name: Validate production Worker JavaScript syntax
        run: node --check cloudflare/worker-operator-access.js

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RefertoPallamano_Blazor.csproj

      - name: Build
        run: dotnet build RefertoPallamano_Blazor.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish RefertoPallamano_Blazor.csproj --configuration Release --no-restore --output ./publish

      - name: Prepare GitHub Pages package
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|<base href="/" />|<base href="/Pallamano_Referto/" />|' ./publish/wwwroot/index.html
          cat > ./publish/ISTRUZIONI-RILASCIO.txt <<'EOF'
          REFERTO PALLAMANO - PACCHETTO DEFINITIVO

          Pacchetto generato dal branch versione-definitiva.
          L'applicazione è configurata per il Worker Cloudflare di produzione:
          https://pallamano-referto-api.kronomen.workers.dev

          Questo archivio contiene i file statici pubblicabili su GitHub Pages.
          Non caricare i file su main e non sovrascrivere l'archivio dati.
          La pubblicazione sul sito ufficiale deve essere eseguita separatamente
          dopo il completamento dei controlli e l'autorizzazione finale.

          Il pacchetto non contiene credenziali o token segreti.
          EOF
          cd ./publish
          zip -r ../RefertoPallamano-DEFINITIVO.zip wwwroot
          zip -u ../RefertoPallamano-DEFINITIVO.zip ISTRUZIONI-RILASCIO.txt

      - name: Prepare complete source project package
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=RefertoPallamano-PROGETTO-COMPLETO.zip HEAD
          cat > SOURCE-PACKAGE-README.txt <<'EOF'
          REFERTO PALLAMANO - PROGETTO COMPLETO
          
          Questo archivio contiene il codice sorgente versionato del branch
          versione-definitiva, inclusi i file C#, Razor, configurazioni,
          workflow e codice Worker Cloudflare.
          
          Per modificare e ricompilare il progetto è necessario .NET SDK 10.
          Il pacchetto non contiene .git, credenziali, password o token segreti.
          Non distribuire il Worker o applicare migrazioni senza una verifica
          esplicita dell'ambiente Cloudflare di destinazione.
          EOF
          zip -u RefertoPallamano-PROGETTO-COMPLETO.zip SOURCE-PACKAGE-README.txt

      - name: Upload complete source project
        uses: actions/upload-artifact@v4
        with:
          name: RefertoPallamano-PROGETTO-COMPLETO
          path: RefertoPallamano-PROGETTO-COMPLETO.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload definitive artifact
        uses: actions/upload-artifact@v4
        with:
          name: RefertoPallamano-DEFINITIVO
          path: RefertoPallamano-DEFINITIVO.zip
          if-no-files-found: error
          retention-days: 30
