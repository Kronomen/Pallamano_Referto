name: Test isolati sincronizzazione

on:
  push:
    branches:
      - test/sync-concorrenza-isolata
  pull_request:
    branches:
      - fix/roster-completo-per-gara
    paths:
      - 'Models/ArchiveModels.cs'
      - 'tests/SyncIsolation/**'
      - '.github/workflows/sync-isolated-tests.yml'

permissions:
  contents: read

jobs:
  sync-tests:
    name: Test merge e concorrenza (senza cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Installa .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Esegue test isolati
        run: dotnet run --project tests/SyncIsolation/SyncIsolation.csproj --configuration Release
