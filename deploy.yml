name: Deploy Referto Pallamano

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Blazor
        run: dotnet publish RefertoPallamano_Blazor.csproj -c Release -o release

      - name: Fix base href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/Referto_Pallamano/" />|' release/wwwroot/index.html
          if ! grep -q '<base href="/Referto_Pallamano/"' release/wwwroot/index.html; then
            sed -i 's|<head>|<head>\n    <base href="/Referto_Pallamano/" />|' release/wwwroot/index.html
          fi

      - name: Disable Jekyll
        run: touch release/wwwroot/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
